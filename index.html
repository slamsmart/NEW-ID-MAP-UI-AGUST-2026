<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071520" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ID-MAP" />
    <meta name="description" content="ID-MAP — Integrasi Data Mangrove dan Pesisir. Platform monitoring mangrove dan ekosistem pesisir Kab. Malang." />
    <title>ID MAP — Integrasi Data Mangrove dan Pesisir</title>

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ID MAP — Integrasi Data Mangrove dan Pesisir" />
    <meta property="og:description" content="Platform monitoring mangrove dan ekosistem pesisir. Data lapangan, citra satelit, dan visualisasi interaktif." />
    <meta property="og:image" content="/assets/id-map-mangrove.jpg" />
    <meta property="og:site_name" content="ID-MAP" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ID MAP — Integrasi Data Mangrove dan Pesisir" />
    <meta name="twitter:description" content="Platform monitoring mangrove dan ekosistem pesisir Kab. Malang." />
    <meta name="twitter:image" content="/assets/id-map-mangrove.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ID MAP typography: DM Sans for UI, Playfair Display for brand accents -->
    <!-- Non-blocking font load: preload CSS, lalu swap saat siap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" /></noscript>

    <!-- Preload hero LCP image (WebP responsive) agar browser mulai mengunduh
         gambar latar hero segera, tanpa menunggu CSS diparse. -->
    <link rel="preload" as="image" href="/assets/optimized/hero-1920.webp"
      imagesrcset="/assets/optimized/hero-480.webp 480w, /assets/optimized/hero-768.webp 768w, /assets/optimized/hero-1080.webp 1080w, /assets/optimized/hero-1536.webp 1536w, /assets/optimized/hero-1920.webp 1920w"
      imagesizes="100vw" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

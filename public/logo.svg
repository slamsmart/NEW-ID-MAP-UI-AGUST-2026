<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 170" fill="none">
  <defs>
    <!-- Badge gradient: top lighter, bottom deeper -->
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a9e4a"/>
      <stop offset="100%" stop-color="#0f4a24"/>
    </linearGradient>
    <!-- Subtle inner top-highlight -->
    <linearGradient id="shineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ─── BADGE ─────────────────────────────────────────────────────── -->
  <rect width="440" height="114" rx="20" fill="url(#badgeGrad)"/>
  <!-- top shine overlay -->
  <rect width="440" height="57"  rx="20" fill="url(#shineGrad)"/>
  <!-- thin bright border -->
  <rect width="440" height="114" rx="20"
        fill="none" stroke="white" stroke-width="1" stroke-opacity="0.12"/>

  <!-- ─── WORDMARK: "ID-MA" ─────────────────────────────────────────── -->
  <!--
    font-size=66, textLength=244 → "ID-MA" forced to exactly 244 px
    starts at x=72, ends at x=316
    baseline y=87, cap-top ≈ y=39, visual-mid ≈ y=63
  -->
  <text
    x="72" y="87"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="66"
    fill="white"
    textLength="244"
    lengthAdjust="spacingAndGlyphs">ID-MA</text>

  <!-- ─── PIN-AS-P ───────────────────────────────────────────────────── -->
  <!--
    Asymmetric teardrop: sisi kiri datar (batang P), sisi kanan melengkung (mangkuk P)
    Tinggi total: 86 px (−43 … +43 dari pusat y)
    Lebar: kiri −22, kanan +28 (total 50 px)
    Pusat: translate(341, 62)
      → top  = 62−43 = 19   (dalam badge)
      → point= 62+43 = 105  (dalam badge, sedikit di bawah baseline 87)
    Margin kiri  = 72 px  |  kanan = 440−(341+28) = 71 px  ← nyaris simetris ✓
  -->
  <g transform="translate(341, 62)">
    <!-- Outer P-pin shape -->
    <path d="
      M -4 -43
      C -4 -43, -22 -33, -22  -8
      C -22  14,  -8  30,   0  43
      C   8  30,  28  14,  28  -8
      C  28 -33,   4 -43,  -4 -43
      Z"
      fill="white"/>
    <!-- Counter hole — offset kanan untuk kesan counter huruf P -->
    <circle cx="4" cy="-19" r="12" fill="#166534"/>
  </g>

  <!-- ─── THIN DIVIDER ──────────────────────────────────────────────── -->
  <line x1="72" y1="103" x2="368" y2="103"
        stroke="white" stroke-width="0.6" stroke-opacity="0.2"/>

  <!-- ─── SUBTITLE ─────────────────────────────────────────────────── -->
  <text
    x="220" y="149"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13.5"
    font-weight="600"
    fill="#1f2937"
    text-anchor="middle"
    letter-spacing="1.6">Integrasi Data Mangrove Pesisir</text>
</svg>

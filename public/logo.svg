  <!-- TEKS ID-MA -->
  <!-- Font-size 108, baseline y=162. Cap-height ~y=85. "ID-MA" lebar ~355px, mulai x=48, berakhir x≈403 -->
  <text x="48" y="162"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="108"
        fill="white"
        letter-spacing="-2">ID-MA</text>

  <!--
    PIN LOKASI — pengganti huruf "P"
    Posisi: setelah "A" berakhir di x≈403
    translate(cx=442, cy=116)
      → top teardrop: cy - 74 = 42  (sedikit di atas cap-height 85, konsisten dengan font bold)
      → bottom point: cy + 48 = 164 (tepat di bawah baseline 162)
    Total tinggi pin: 122px ≈ setinggi huruf kapital + sedikit descender
    Lebar maks: ±34px → kiri 408, kanan 476
  -->
  <g transform="translate(442, 116)">
    <!--
      Teardrop path — dibaca dari atas ke bawah:
      Puncak (0, -74) → lengkung kiri keluar ke (-34, -22) → meruncing ke titik bawah (0, +48)
      Simetri kanan → kembali ke puncak
    -->
    <path d="M 0 -74
             C -10 -74, -36 -62, -36 -28
             C -36 -6,  -20  16,  0  48
             C  20  16,  36  -6,  36 -28
             C  36 -62,  10 -74,  0 -74
             Z"
          fill="white"/>
    <!-- Ring lubang tengah: pusat di (0, -42), radius 15 -->
    <circle cx="0" cy="-42" r="15" fill="#1a8c3e"/>
  </g>

  <!-- SUBTITLE — center antara x=48 dan x=476, midpoint≈262 -->
  <text x="262" y="206"
        font-family="Arial, sans-serif"
        font-weight="600"
        font-size="18"
        fill="white"
        text-anchor="middle"
        letter-spacing="1.8">Integrasi Data Mangrove Pesisir</text>

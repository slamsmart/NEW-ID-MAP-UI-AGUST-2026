    <path d="M 1 19 Q 28 16 57 19"/>
    <path d="M 1 25 Q 28 22 57 25"/>
    <path d="M 1 31 Q 28 28 57 31"/>
    <path d="M 1 37 Q 28 34 57 37"/>
    <path d="M 1 43 Q 28 40 57 43"/>
  </g>

  <!-- Pin icon tengah -->

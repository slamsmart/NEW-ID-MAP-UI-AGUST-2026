<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background bulat hijau -->
  <rect width="64" height="64" rx="14" fill="#16a34a"/>

  <!-- Indonesia silhouette mini: western mass -->

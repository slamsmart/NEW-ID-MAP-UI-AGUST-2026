  <!-- "ID" teks kecil di kiri bawah, sudut -->
  <text x="7" y="59"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="11"
        fill="white"
        letter-spacing="0.5">ID</text>

           C 47 10,51 6,55 11 C 58 15,57 22,53 27
           C 50 31,49 36,51 41 C 52 44,48 47,43 46
           C 38 45,33 47,27 46 C 22 45,16 47,11 45
           C 6 43,2 38,2 30 Z"
